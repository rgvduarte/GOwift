<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GOindoor</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0b0c; --fg: #ffffff; --accent: #ffffff; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 17px/1.5 Helvetica, "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      button { font: inherit; font-weight: 600; padding: 12px 28px; border: 0; border-radius: 999px; background: var(--accent); color: #0b0b0c; }
      p { max-width: 28em; }
    </style>
  </head>
  <body>
    <main>
      <h1>GOindoor</h1>
      <p>The GOindoor server can't be reached right now. Check your internet connection, or whether your own server is running.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script type="module">
      import { SERVER_URL } from "./server.js";
      document.getElementById("retry").addEventListener("click", () => location.replace(SERVER_URL));
    </script>
  </body>
</html>
