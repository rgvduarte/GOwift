# GOindoor — proof of concept
#
#   make up        build and start (http://localhost:8080)
#   make update    git pull, rebuild, restart
#
# All settings come from .env (see .env.example). Docker Compose reads .env
# automatically for the ${...} values below.

name: goindoor

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Exported by the Makefile (git commit and date); `dev` when built by hand.
        GOINDOOR_BUILD_SHA: ${GOINDOOR_BUILD_SHA:-dev}
        GOINDOOR_BUILD_DATE: ${GOINDOOR_BUILD_DATE:-}
    image: goindoor-server:${GOINDOOR_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      GOINDOOR_SERVER_NAME: ${GOINDOOR_SERVER_NAME:-GOindoor}
      GOINDOOR_ROUTE_FILE: /app/routes/${GOINDOOR_ROUTE:-rolling-hills}.json
      GOINDOOR_TARGET_RIDERS: ${GOINDOOR_TARGET_RIDERS:-12}
      GOINDOOR_MAX_PLAYERS: ${GOINDOOR_MAX_PLAYERS:-50}
      GOINDOOR_MAX_PADDLE_PLAYERS: ${GOINDOOR_MAX_PADDLE_PLAYERS:-20}
      GOINDOOR_MAX_VISIBLE_RIDERS: ${GOINDOOR_MAX_VISIBLE_RIDERS:-200}
      GOINDOOR_TICK_HZ: ${GOINDOOR_TICK_HZ:-20}
      GOINDOOR_BROADCAST_HZ: ${GOINDOOR_BROADCAST_HZ:-4}
      GOINDOOR_RACE_COUNTDOWN_S: ${GOINDOOR_RACE_COUNTDOWN_S:-30}
      GOINDOOR_MAX_RACE_LAPS: ${GOINDOOR_MAX_RACE_LAPS:-20}
      GOINDOOR_BOT_SEED: ${GOINDOOR_BOT_SEED:-}
      GOINDOOR_AUTH_MODE: ${GOINDOOR_AUTH_MODE:-open}
      GOINDOOR_ROUTES_DIR: /app/routes
      GOINDOOR_PUBLIC_URL: ${GOINDOOR_PUBLIC_URL:-}
      GOINDOOR_TRUST_PROXY: ${GOINDOOR_TRUST_PROXY:-false}
      GOINDOOR_MAX_CONNECTIONS_PER_IP: ${GOINDOOR_MAX_CONNECTIONS_PER_IP:-4}
      GOINDOOR_MESSAGES_PER_SECOND: ${GOINDOOR_MESSAGES_PER_SECOND:-20}
      GOINDOOR_ALLOWED_ORIGINS: ${GOINDOOR_PUBLIC_URL:-}
      GOINDOOR_STRAVA_CLIENT_ID: ${GOINDOOR_STRAVA_CLIENT_ID:-}
      GOINDOOR_STRAVA_CLIENT_SECRET: ${GOINDOOR_STRAVA_CLIENT_SECRET:-}
      GOINDOOR_SECRET_KEY: ${GOINDOOR_SECRET_KEY:-}
      GOINDOOR_REQUIRE_STRAVA: ${GOINDOOR_REQUIRE_STRAVA:-false}
      GOINDOOR_ALLOW_SIMULATED_TRAINER: ${GOINDOOR_ALLOW_SIMULATED_TRAINER:-true}
      GOINDOOR_PRIVACY_URL: ${GOINDOOR_PRIVACY_URL:-}
      GOINDOOR_OBN_URL: ${GOINDOOR_OBN_URL:-}
      GOINDOOR_ANALYTICS_DOMAIN: ${GOINDOOR_ANALYTICS_DOMAIN:-}
      GOINDOOR_ANALYTICS_SCRIPT: ${GOINDOOR_ANALYTICS_SCRIPT:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # Defaults to localhost only. Set GOINDOOR_HTTP_BIND=0.0.0.0 to expose it.
      - "${GOINDOOR_HTTP_BIND:-127.0.0.1}:${GOINDOOR_HTTP_PORT:-8080}:8080"
    networks:
      default:
      metrics:
        aliases: [goindoor-server]
    volumes:
      # Routes are mounted so new routes need no rebuild.
      - ./routes:/app/routes:ro
      # Strava logins (SQLite), so they survive `make update`. Back this volume up.
      - data:/app/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional landing page (static Astro site, see landing/). Enable with
  # COMPOSE_PROFILES=landing (plus tls for the bundled Caddy) and
  # GOINDOOR_LANDING_DOMAIN in .env. Without it, nothing changes.
  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
      args:
        PUBLIC_SITE_URL: ${GOINDOOR_LANDING_URL:-http://landing.localhost}
        PUBLIC_APP_URL: ${GOINDOOR_PUBLIC_URL:-}
        PUBLIC_DISCORD_URL: ${GOINDOOR_DISCORD_URL:-}
        # Same privacy policy as the app's start menu, so one setting covers both.
        PUBLIC_PRIVACY_URL: ${GOINDOOR_PRIVACY_URL:-}
        PUBLIC_IMPRINT_URL: ${GOINDOOR_LANDING_IMPRINT_URL:-}
        PUBLIC_PLAUSIBLE_DOMAIN: ${GOINDOOR_LANDING_PLAUSIBLE_DOMAIN:-}
        # Same script as the app, so one setting covers both.
        PUBLIC_PLAUSIBLE_SCRIPT: ${GOINDOOR_ANALYTICS_SCRIPT:-}
    image: goindoor-landing:${GOINDOOR_IMAGE_TAG:-local}
    profiles: ["landing"]
    restart: unless-stopped
    ports:
      # For your own reverse proxy on this machine; the bundled Caddy uses the
      # Compose network instead.
      - "${GOINDOOR_HTTP_BIND:-127.0.0.1}:${GOINDOOR_LANDING_PORT:-8081}:80"
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional HTTPS for public servers without their own reverse proxy
  # (Web Bluetooth needs a secure context). Enable with COMPOSE_PROFILES=tls
  # and GOINDOOR_DOMAIN in .env. Behind your own Caddy/nginx, leave it off.
  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      GOINDOOR_DOMAIN: ${GOINDOOR_DOMAIN:-localhost}
      GOINDOOR_LANDING_DOMAIN: ${GOINDOOR_LANDING_DOMAIN:-http://landing.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  caddy_data:
  caddy_config:

networks:
  metrics:
    name: goindoor-metrics
