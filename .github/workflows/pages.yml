name: Pages

# Builds the landing page (landing/, Astro) and publishes it on GitHub Pages:
# https://rgvduarte.github.io/GOwift/
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The *Ride now* buttons open the public game server on
# Render; a repository variable GOINDOOR_PUBLIC_URL points them elsewhere.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "routes/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # e.g. https://rgvduarte.github.io/GOwift; its path becomes the base path.
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          PUBLIC_APP_URL: ${{ vars.GOINDOOR_PUBLIC_URL || 'https://goindoor.onrender.com' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
